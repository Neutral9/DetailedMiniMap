; Detailed MiniMap - defaults. The in-game menu (SKSE Menu Framework, "Detailed MiniMap") saves into
; DetailedMiniMap_User.ini, which overrides this file key by key.

[Map]
Enabled=1
; where the minimap is shown: 0 everywhere, 1 only indoors (caves, houses), 2 only outdoors
ShowWhere=0
; the keys: a key code - a keyboard scan code (49 = N), 256 + a mouse button (264 / 265 = the wheel up / down),
; 266 + a gamepad button (266-269 Dpad up down left right, 270 Start, 271 Back, 272 LS, 273 RS, 274 LB, 275 RB,
; 276 A, 277 B, 278 X, 279 Y, 280 LT, 281 RT); 0 = none. ...Mod: a key held with it (0 = none), e.g. 42 = Left Shift
; ...KeyPad / ...ModPad: the same action on the gamepad - both binds work (the menu puts a gamepad key there)
; the key that shows / hides the minimap; Visible: shown now
ToggleKey=49
ToggleMod=0
ToggleKeyPad=0
ToggleModPad=0
; 1 = the minimap shows only while its key is held (else the key switches it on and off)
ToggleHold=0
Visible=1
; the menu's language: -1 = the game's, 0 ru, 1 en, 2 fr, 3 it, 4 de, 5 es, 6 pl, 7 zh (traditional), 8 ja
; (the texts: Data/SKSE/Plugins/DetailedMiniMap/Translations/<code>.txt)
Language=-1
MinimapSize=600
; world units from the minimap's centre to its edge: outside, and in caves and houses
MinimapRange=3700
MinimapRangeInside=1200
; degrees above the floor the minimap is seen from (90 = straight down)
MinimapTilt=55
NorthUp=0
; 1 = a round minimap instead of the square; the square's corners rounded this far (px at 1080p)
MinimapRound=1
MinimapCorner=40
; 0 = no frame round the minimap
MinimapFrame=1
; 1 = the character's pointer shows where the camera looks; 0 = where the character faces
PointerCamera=0
; the screen corner the minimap sits in (0 top left, 1 top right, 2 bottom left, 3 bottom right) and how far from it (px at 1080p)
Anchor=1
OffsetX=18
OffsetY=18
IconSize=1
; seconds an icon takes to fade in when it turns up, and to fade out once its thing is gone (0 = at once)
IconFadeIn=0.35
IconFadeOut=0.35
; icons only for things this close to you (world units, 0 = as far as the map shows; quest targets always)
IconRange=0
; indoors: things to take (not characters, doors, quests) only this far above or below your feet (0 = every floor)
LootHeight=0
; the whole minimap this opaque (0.1 .. 1)
MinimapOpacity=1
; containers with nothing to take left off the map; icons of one kind overlapping merged into one (zoom in to part them)
HideEmpty=1
GroupIcons=1
; inside (caves, houses): cut away the ceilings - everything this far over the feet
Cut=1
CutHeight=80
; beams from the character to the quest targets, and their key (48 = B, 0 = none)
QuestBeam=1
; the quests set active in the journal only (their targets on the map, the beams to them):
; 1 = one beam only, to the nearest of them (nearest by the whole way, through doors);
; 0 = a beam to each quest set active in the journal
BeamNearest=1
BeamKey=48
BeamMod=0
BeamKeyPad=0
BeamModPad=0
; the game's local map (in the map menu) replaced by this one: dragged with the mouse, zoomed with the wheel
LocalMap=1
; the key that opens the local map straight from the game (38 = L, 0 = none)
LocalMapKey=38
LocalMapMod=0
LocalMapKeyPad=0
LocalMapModPad=0
; 1 = the local map is open only while its key is held (else the key opens and closes it)
LocalMapHold=0
; the local map turned and tilted while this is held (mouse, or the gamepad's left stick; R resets the view): 257 = right mouse button
RotateKey=257
RotateMod=0
RotateKeyPad=0
RotateModPad=0
; 1 = the turn (left / right) or the tilt (up / down) the other way round
RotateInvertX=0
RotateInvertY=0
; how fast the local map turns (0.2 .. 3)
RotateSpeed=1
; 1 = the minimap and the local map only while the character carries an item: NeedItemID = its EditorID
; (needs the EditorIDs kept, e.g. by powerofthree's Tweaks) or Plugin.esp|0x800 (its form id in that plugin)
NeedItem=0
NeedItemID=
; the minimap zoomed in / out (outside or inside, where you are): Shift + the wheel
ZoomInKey=264
ZoomInMod=42
ZoomInKeyPad=0
ZoomInModPad=0
ZoomOutKey=265
ZoomOutMod=42
ZoomOutKeyPad=0
ZoomOutModPad=0
; a detailed log in Documents/My Games/Skyrim Special Edition/SKSE/DetailedMiniMap.log: timings, rebuilt cells and why
; (turn it on to report stutters or a flickering map, off otherwise)
DebugLog=0

[MapLook]
; 0 = the colours below, 1 = vanilla (the game's local map: sepia palette and frame)
Style=1
; the icons: a folder of Data/Textures/DetailedMiniMap/icons (Default: round badges, Vanilla: as the game's map markers;
; a new folder there is a new style - its pictures named as in Default, any it lacks taken from Default)
IconStyle=Vanilla
; the minimap's frame: a folder of Data/Textures/DetailedMiniMap/frames (Runestone, Frost, GoldRope, Ironwork, Embers, Compass;
; for the vanilla map: NordicKnot, Leather, Oakwood, Dwemer, Parchment
; - a round.dds and a square.dds each; a new folder is a new frame), or empty: the plain one drawn by the style
FrameStyle=
; how opaque the minimap's frame and the icons are (0..1; the character's pointer always in full)
FrameOpacity=1
IconOpacity=1
; the quest beams: width (0.5 .. 3), opacity, the light running along them; their colour: BeamR/G/B below
BeamWidth=1
BeamOpacity=1
BeamLights=1
Grid=0
GridSize=128
Contours=0
ContourStep=64
LineStrength=1
GroundR=0.333
GroundG=0.466
GroundB=0.229
GroundBrightness=1
GroundOpacity=1
GeometryR=0.597
GeometryG=0.607
GeometryB=0.626
GeometryBrightness=1
GeometryOpacity=1
DepthShade=0.5
FadeTime=0.8
Roads=1
RoadWidth=1
RoadR=0.632
RoadG=0.486
RoadB=0.262
Water=1
; 1 = under water (your head below the surface) the water on the map turns mostly see-through: the bottom, wrecks, chests
SeeUnderwater=1
WaterR=0.146
WaterG=0.392
WaterB=0.637
; the frame tinted (1 1 1: as it is) and the quest beams' colour
FrameR=1
FrameG=1
FrameB=1
BeamR=1
BeamG=0.769
BeamB=0.314

[Icons]
; which icons are drawn (the menu switches them too). The pictures are
; Data/Textures/DetailedMiniMap/icons/<style>/<name>.dds - replace them with your own square DDS files.
Show_enemy=1
Show_guard=1
Show_npc=1
Show_follower=1
Show_creature=1
Show_door=1
Show_food=1
Show_potion=1
Show_container=1
Show_weapon=1
Show_armor=1
Show_loot=1
Show_quest=1
Show_body=1
Show_flora=1
Show_ore=1
; chests and strongboxes (apart from the other containers), clutter (buckets, brooms, pots: the game's VendorItemClutter)
Show_chest=1
Show_clutter=0
